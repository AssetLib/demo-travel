# Registers assetlib.catalog.json with the hosted demo workspace on every push to main (from the assetlib init template).
# Needs the ASSETLIB_TOKEN repository secret (a Declare-scope token from Settings > Tokens in the console) and the
# ASSETLIB_ORG and ASSETLIB_APP repository variables (the workspace and app IDs from Settings > General).
name: Assetlib sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Dependency install scripts stay off: this job needs none, and the step after next holds the token.
      - run: npm ci --ignore-scripts
      - name: Read the app version
        id: app
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"
      - name: Register placements
        env:
          ASSETLIB_TOKEN: ${{ secrets.ASSETLIB_TOKEN }}
          ASSETLIB_CONSOLE: 'https://console.assetlib.dev'
          ASSETLIB_ORG: ${{ vars.ASSETLIB_ORG }}
          ASSETLIB_APP: ${{ vars.ASSETLIB_APP }}
          APP_VERSION: ${{ steps.app.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node ./node_modules/@assetlib/cli/bin/assetlib.mjs sync --catalog assetlib.catalog.json --platform expo \
            --app-version "$APP_VERSION" --build-number "$BUILD_NUMBER" --references 'src'
