# Registers assetlib.catalog.json with the hosted demo workspace on every push to main (from the assetlib init template).
# Needs ASSETLIB_TOKEN (a Declare-scope token from Settings > Tokens in the console) and the ASSETLIB_ORG and
# ASSETLIB_APP repository variables (the workspace and app IDs from Settings > General). The token belongs in the
# assetlib-sync environment with its deployment branches limited to main, not in a repository secret, so no other
# branch can read it.
name: Assetlib sync
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # GitHub compares expressions without regard to case, so the shell checks the exact ref.
  branch_gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then echo 'allowed=true' >> "$GITHUB_OUTPUT"; fi
  sync:
    # Only main runs this job: a manual run from any other branch is skipped.
    needs: branch_gate
    if: needs.branch_gate.outputs.allowed == 'true'
    environment: assetlib-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Dependency install scripts stay off: this job needs none, and the next step holds the token.
      - run: npm ci --ignore-scripts
      - name: Register placements
        env:
          ASSETLIB_TOKEN: ${{ secrets.ASSETLIB_TOKEN }}
          ASSETLIB_CONSOLE: 'https://console.assetlib.dev'
          ASSETLIB_ORG: ${{ vars.ASSETLIB_ORG }}
          ASSETLIB_APP: ${{ vars.ASSETLIB_APP }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          node ./node_modules/@assetlib/cli/bin/assetlib.mjs sync --catalog assetlib.catalog.json --platform expo \
            --app-version "$APP_VERSION" --build-number "$BUILD_NUMBER" --references 'src'
